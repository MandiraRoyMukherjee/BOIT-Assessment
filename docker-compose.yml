services:
  db:
    image: postgres:16-alpine
    container_name: workbench-db
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench
      POSTGRES_DB: workbench
    ports:
      - "5432:5432"
    volumes:
      - workbench-data:/var/lib/postgresql/data

volumes:
  workbench-data:
